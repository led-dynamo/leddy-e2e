[package]
org = "led-dynamo"
name = "leddy-e2e"
version = "0.1.0"
description = "Cross-product end-to-end tests for the Leddy fleet"
license = "MIT"
language = "polyglot"

[package.repository]
vcs = "git"
url = "https://github.com/led-dynamo/leddy-e2e"

[install]
adapter = "none"
dir = ".vendor/.zed"

[dependencies]
"led-dynamo/leddy-clients" = "^0.1.0"
"led-dynamo/leddy-lib" = "^0.1.0"
"led-dynamo/leddy-interfaces" = "^0.1.0"
"led-dynamo/leddy-cli" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "target/**", "dist/**", "build/**", "coverage/**", "node_modules/**", "**/*.log"]
